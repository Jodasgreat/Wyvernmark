 wyvernmark.200.t:0 "Backwater no More"
 wyvernmark.200.d:0 "For centuries, Wyvernmark has been regarded as an irrelevant stretch of mountains on the far edges of the Empire. You would be hard-pressed to find anyone in Anbencost who could even identify it on a map.\n\nNo longer.\n\nSince the Convent took power, Wyvernmark has grown to eclipse its historic overlords in Verne. Now, when [Root.Monarch.GetName] enters the hall of the Imperial Palace, everyone turns to look. They do not know that a monster walks among them, but they will learn to fear [Root.Monarch.GetHerHim] all the same.\n\nToday, [Root.Monarch.GetSheHe] has but one demand for the diet -- A title. A title worthy of Wyvernmark's new status.\n\nNo more shall it be regarded as a common Margravate."
 wyvernmark.200.a:0 "From today onwards, it is an Arch-Margravate."

