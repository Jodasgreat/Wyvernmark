 wyvernmark.104.a:0 ""
 
 wyvernmark.105.t:0 "A New Kind of Roost"
 wyvernmark.105.d:0 "'Harpies. A monstrous avian race that, thanks to their gift of flight, builds roosts high up in the mountains where land-bound races like humans would be unable to disturb them. Should you ever find yourself in an area of probable harpy activity, dear reader, stay on high alert. Once the harpy has you in her claws, you will never be able to escape the roost.' -- Excerpt from 'Beasts of Halann and All Their Terrible Forms'\n\nNaturally, the author of this book was unaware that he lived in a country ruled by those very harpies. Unlike the poorly-informed fantasy he describes, however, the harpies of The Convent find themselves just as hampered by the curse of gravity as he. Nonetheless, it would be extremely advantageous were they to have a roost of that sort. A self-sufficient city in the mountains where outsiders could not enter, and insiders could not leave without the Matriarch's approval.\n\nUnlike the grand roost at Heunthume, or even their mothers' old nests in Akasik, this would not be a home perched on the cliffside with no ladders up. This roost would be more subtle. More... terrestrial. It would look less like a bird's nest and more like a small mountain village, shielded by high walls on all sides with all access funneled through a single gate.\n\nTo the humans around, this roost would be assumed to be little more than a monastery."
 wyvernmark.105.a:0 "Or, perhaps, a Convent."
 
