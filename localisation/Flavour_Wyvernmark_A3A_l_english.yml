 #startup screen
 string_start_title_wyvernmark:0 "Wyvernmark, at the Edge of the Empire"
 string_start_wyvernmark:0 "§g'This land welcomed us, though we did not welcome it. The Khenak Mountains are foreign to us, and yet I know that their shadow will be my tomb. The people, no less mustached and boisterous than their Vernman brothers, boast of their grandfathers who rode wyverns with great bronze wings off of these peaks. They are, in that sense, little different from us. Dreaming of wings that may never fly again.'\n-Istárt'a Nat'ukkát'u, 1438§!\n\n§OPrimer§!\nOfficially part of the Duchy of Verne, few in §YAnbennar§! can poit to Wyvernmark on a map. Fewer still will tell you it holds any importance. A small fiefdom located on the far southern reaches of the Empire, §YWyvernmark§! nonetheless holds a tremendously valuable role. The Margraves of Wyvernmark have been entrusted for generations with the dual tasks of guarding the §YKhenak Mountains§! from the rampaging gnolls of §YXanzerbexis§! and safeguarding the few remaining §Ywyvern nests§! hidden among those mountains.\n\nIn recent years, the talk of the town across Wyvernmark has been the arrival of a small group of unusual women on their shores. Refugees from §YAkasik§!, across the Divenhal, these women form a tight-knit group and insist on maintaining strict standards of conservative dress at all times, leaving no skin exposed aside from their faces. Their appearance and mannerisms have led the locals to refer to them as the §YConvent§!, even if no one has ever witnessed them praying to a god. In 1431, the Convent's leader, a woman named §YIstárt'a§!, married §YMargrave Roger III§!, and by all accounts, their marriage was one of true love. Soon, the Margrave plans to introduce his favored and talented daughter, Astúria, to the realm. With her on the throne and the gnolls in retreat, talk has emerged of a golden age on the horizon. Will this tiny border fiefdom finally find its wings, or will it be forgotten as a mere footnote to Verne's history?"


 #MT description
 DLC_missions_A3A_TOOLTIP_INSTANT:0 "§YCustom Mission Tree§!" 
 missions_A3A_desc:0 "This country has a custom mission tree"
 LANDING_missions_A3A_TEXT:0 "To most, Wyvernmark may be a backwater ruled by an insignificant lord. To the Convent, however, it is the perfect staging ground for their plan.\nBy disguising themselves as humans, a small group of harpies will marry their way onto every throne in Cannor in the name of their revenge.\n\n§YDesigner§!, §YCoder§!, and §YWriter§!: Jodasgreat"
