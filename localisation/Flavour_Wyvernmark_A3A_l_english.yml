 A3A_kill_heir_desc:0 "Good night, sweet prince."
 A3A_kill_heir_tt:0 "§RKill the heir§! of a random country that meets the requirements."
 A3A_kill_ruler_title:0 "Assassinate a Ruler"
 A3A_kill_ruler_desc:0 "He'll never know what hit him."
 A3A_kill_ruler_tt:0 "§RKill the ruler§! of a random country that meets the requirements."
 A3A_harpy_highlighter_heir_title:0 "Highlight Stonewing Harpy Heirs"
 A3A_harpy_highlighter_heir_desc:0 "Even when born to foreign houses, a sister is a sister."
 
