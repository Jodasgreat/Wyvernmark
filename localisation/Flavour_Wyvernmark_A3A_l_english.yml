 DLC_missions_A3A_TOOLTIP_INSTANT:0 "§YCustom Mission Tree§!" 
 missions_A3A_desc:0 "This country has a custom mission tree"
 LANDING_missions_L76_TEXT:0 "To most, Wyvernmark may be a backwater. Home to an insignificant lord whose duty is to protect the endangered wyverns at the behest of the Vernmen. To The Convent, however, it is the perfect staging ground for their plan.\nA small group Stonewing Harpies escaped gnollish slavery in Akasisk, but it was humanity who drove them from their ancient home in Cannor. By disguising themselves as humans, they will ingratiate themselves will all of Cannor's noble houses.\nBy the time the humans realize what has happened, a harpy will be sitting on every throne in Cannor.\n\n§YDesigner§!, §YCoder§!, and YWriters§!: Jodasgreat"
