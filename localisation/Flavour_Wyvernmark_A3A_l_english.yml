 #decisions
 bring_into_fold_title:0 "Bring Our Sisters into the Fold"
 bring_into_fold_desc:0 "It is fine and well that one of our sisters sits upon another nation's throne, but if left alone too long, she may start to believe she actually has any power of her own. We must remind our sisters that the Matriarch's will is absolute, and that all that's yours is the Matriarch's."
 A3A_bring_into_fold_tt:0 "Form a §Ypersonal union§! with a random country that meets the requirements."
 A3A_kill_consort_title:0 "Assassinate a Consort"
 A3A_kill_consort_desc:0 "Shank that bitch."
 A3A_kill_consort_tt:0 "§RKill the consort§! of a random country that meets the requirements."
 A3A_harpy_highlighter_consort_title:0 "Highlight Stonewing Harpy Consorts"
 A3A_harpy_highlighter_consort_desc:0 "We make sure to keep tabs on our sisters who have married into foreign nobility."
