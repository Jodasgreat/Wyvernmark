l_english:
 # storage for these damn things §§§§§§§§§§§§§
 # and some good vowels íéóúá
 
 # column 1
 A3A_fill_the_ranks_title:0 "Fill the Ranks"
 A3A_fill_the_ranks_desc:0 "Our domain is small, mountainous, and under threat by beasts from the East. We have no choice but to seek the help of adventurers to bolster our forces."
 A3A_fill_the_ranks_tt:0 "Unlocks the §YVernman Auxiliaries§! mercenary company."
 A3A_defend_the_mountains_title:0 "Defend the Mountains"
 A3A_defend_the_mountains_desc:0 "The fortress at Arca Sur has long guarded the Empire's Southeastern frontier. It has served us well, but were it to fall, all of Wyvernmark would fall with it. We must plan for defense in depth and construct another bastion in the mountains."
 A3A_defend_the_mountains_tt:0 "Unlocks the §YMountain Company§! mercenary company."
 A3A_deal_with_adv_title:0 "Deal with the Adventurers"
 A3A_deal_with_adv_desc:0 "The Verneman people have a proud tradition of adventuring. The most decorated among them have recorded countless kills on beasts and monsters -- including our fellow harpies.\n\nWhile many in our new administration are wary of their attitude towards 'monsters,' we cannot deny that the aid of these adventurers is indispensible in keeping the peace and guarding our frontier. We must find a way to integrate the adventurers into our administration without letting them catch on to our secret."
 A3A_deal_with_adv_tt:0 "Re-enables the §YAdventurers§! estate."
 A3A_persuade_adventurers_title:0 "Persuade the Adventurers"
 A3A_persuade_adventurers_desc:0 "As the Verneman adventurers become more integrated in our administration, we must find a way to enure their loyalty… and their silence."
 A3A_persuade_adventurers_tt:0 "Enables the §YEnthralled Adventurers§! mercenary company."
 A3A_those_who_fly_title:0 "Those who Fly for Us"
 A3A_those_who_fly_desc:0 "Harpies are an avian race. Yet, since arriving on the shores of Cannor, our flock has abandoned the gift of flight in the name of survival. How fortunate it is, then, that the answer to our conundrum lies here in the very mountains we call home, Wyverns.\n\nIf we can locate the Wyverns' nests and tame them, perhaps we could take to the skies once more without exposing our secrets."
 A3A_those_who_fly_tt:0 "Enables the §YWyvern Rider Company§! mercenary company."
 A3A_wives_on_wyverns_title:0 "Wives on Wyverns"
 A3A_wives_on_wyverns_desc:0 "The skills of wyvern riding may have first blossomed among our adventurers and soldiers, but it need not end there. Our sisters in Bulwar are reknowned as messengers and diplomats thanks to their ability to cover long distances through the air. Should we train our harpy envoys in the art of wyvern-riding, we could reach the halls of Cannor's great houses with far better speed and frequency."

 # column 2
 A3A_interdict_corsairs_title:0 "Interdict Corsairs"
 A3A_interdict_corsairs_desc:0 "'The Convent' might have escaped the gnolls of Sarhal, but those gnolls aren't ones to leave business unfinished. If we want to have any hope of maintaining our freedom, we must raise a fleet to keep gnollish pirates at bay."
 A3A_harpy_adv_title:0 "A Harpy Adventurer"
 A3A_harpy_adv_desc:0 "'Now listen close, the adventurers may be valuable tools, but we must not involve ourselves with them. Who knows what might happen if even one of those brutes caught wind of who we truly are? Just do as I say, and I'll arrange a handsome young Esmarian baron for you to -- Hey! Wait! Where are you going!?'"
 A3A_harpy_adv_tt:0 "Enables the §YDaughters of Stone§! mercenary company."
 A3A_anti_monster_title:0 "'Anti-Monster' Coalition"
 A3A_anti_monster_desc:0 "We have a score to settle with the gnolls down south. The ones who held our mothers in slavery for far too long.\n\nFortunately, our neighbors seem mightily eager to be rid of the gnollish scourge. Just a few choice words, and these fools will take arms to slay any 'monster' you point them at."
 A3A_stone_wings_title:0 "Wings of Stone"
 A3A_stone_wings_desc:0 "At last, it is time to strike across the Divenhal and liberate the homes of our foremothers. No longer shall the gnolls keep our sisters in chains, no longer shall the Akasi humans deceive them with false promises of 'co-existence'!"
 A3A_sarhal_lessons_title:0 "Bringing our Sisters in Line"
 A3A_sarhal_lessons_desc:0 "Now that we have retaken our old home of Akasik, we realize that our flock has changed far more than we had anticipated. As far as the local Stonewings are concerned, our customs and practices appear foreign. To them, we are Cannorians, no different from the humans we rule. Even worse, perhaps, as they view the ways of the Convent as an affront to their pride as harpies.\n\nWe will teach them the error of their old ways. We will bring them in line with the teachings of the Convent. We will rebuild the Stonewing roosts in the image of our Enneutíai in Cannor."

 #Column 3
 A3A_Beautiful_Girl_title:0 "My Beloved Daughter"
 A3A_Beautiful_Girl_desc:0 "My wife has never borne me a son, but the daughter she gave me I wouldn't trade for the world. Soon, it will be time to introduce her to the world."
 
 A3A_New_Dynasty_title:0 "A New Dynasty"
 A3A_New_Dynasty_desc:0 "With our new ruler coming of age, Wyvernmark enters a new era. Henceforth, this land will be ruled by a dynasty of a different character. Yet, for the common people, nothing will change. They will notice nothing.\n\nThey should notice nothing."
 A3A_wyvern_nest_title:0 "The Wyverns' Nest"
 A3A_wyvern_nest_desc:0 "Thus far, the flock has lived in secret among the humans of Wyvernmark. This was fine when our numbers were small, but as the flock expands the risk of detection skyrockets.\n\nWe should take advantage of the majestic mountains around Bronzewing Hall to establish a refuge away from the prying eyes of human society. There, our daughters need not fear the threat of detection, nor the corrupting influence of human men."
 A3A_wyvern_nest_tt:0 "§CEvent Insight:§!\nWe will make improvements to all existing §Yroosts§!."
 A3A_imperial_court_title:0 "In the Imperial Court"
 A3A_imperial_court_desc:0 "Our ambitions do not stop here at the Empire's frontier. We must establish our presence as an integral member of the Empire of Anbennar. Should we attain the backing of one of the Empire's foremost noble houses, we will find it far easier to garner the respect we deserve."
 A3A_queen_of_frontier_title:0 "Queen of the Frontier"
 A3A_queen_of_frontier_desc:0 "No longer is Wyvernmark some hilly backwater living in the shadow of Verne. No longer is our land a glorified border fort where adventurers come to play. Wyvernmark is now one of the Empire's most prominent noble domains.\n\nOur titles should reflect our newfound status."
 A3A_queen_of_frontier_tt:0 "§CEvent Insight:§! We will supplant the position of one of the Empire's Electors."
 A3A_city_in_the_hills_title:0 "City in the Hills"
 A3A_city_in_the_hills_desc:0 "If we hope to be taken seriously as Arch-Margravines, our capital must look the part.\n\nEven now, Bronzewing Hall feels more like a ramshackle camp of adventurers rather than the proud imperial city it ought to be.\n\nWe must draw up a new plan for the city -- wide, clean boulevards lined with proud stone buildings. On one end, our palace; on the other, an imposing new institution of magic that will rival the Magesterium."
 A3A_flock_together_title:0 "Flock Together"
 A3A_flock_together_desc:0 "Our sisters now sit on thrones across the Empire. We must ensure our interests are aligned under the direction of The Convent."
 A3A_heart_of_empire_title:0 "Heart of the Empire"
 A3A_heart_of_empire_desc:0 "Far from our humble roots, we now command the respect and admiration of all around us. The Empire of Anbennar once seemed intimidating, once posed a threat to our kind. Now, however, we have nothing to fear.\n\nFor, through our networks of marriage and diplomacy, it is they who must defer to us."
 A3A_pigeons_and_doves_title:0 "Pigeons and Doves"
 A3A_pigeons_and_doves_desc:0 "Since the establishment of 'The Convent,' tension has brewed among the harpies of Cannor. There are many of us now; that alone is testament to our success. However, many of them hold a deep resentment against our leaders.\n\nThis division can go on no longer. The Matriarch will call an emergency assembly of leading harpies from across our realms to settle the debate between these 'Pigeons' and 'Doves' once and for all."

 # column 4
 A3A_Giving_Tribute_title:0 "Giving Tribute"
 A3A_Giving_Tribute_desc:0 "From the beginning, the Dukes of Verne have been our gracious overlords. They've protected us from incursions and supported us through disasters. It would only be natural for us to offer the hand of one of our lovely court maidens as a show of our loyalty.\n\nThe Duke already has a wife, you say? That sounds like a solveable problem."
 A3A_giving_tribute_tt:0 "§CEvent Insight:§! We will persuade the Duke of Verne to make one of our sisters his consort."
 A3A_in_the_family_title:0 "All in the Family"
 A3A_in_the_family_desc:0 "We mourn the passing of our liege, the good Duke of Verne. How fortunate we are, then, to have one of our own as his successor.\n\nOf course, we will support the new Duchess, but while she might have a superior title from the Empire's perspective, we must make sure she knows that she is of 'The Convent' first and foremost. Every Sister owes her loyalty to the Matriarch above all else."
 A3A_handmaidens_handiwork_title:0 "Handmaidens' Handiwork"
 A3A_handmaidens_handiwork_desc:0 "Our experience in Verne has taught us valuable lessons when it comes to realizing our ambitions. Placing a harpy on a Cannorian throne is not so simple a matter as sending a marriageable young maiden to their court. If the ruler already has a human wife, our efforts will be for naught.\n\nOf course, we could fix that little problem." 
 A3A_handmaidens_handiwork_tt:0 "§CEvent Insight:§! We will gain the ability to assassinate the consorts of certain nations."
 A3A_dove_throne_title:0 "A Dove on the Throne"
 A3A_dove_throne_desc:0 "Surely, they would not have called it the 'Dove Throne' if we were not destined to sit upon it."
 A3A_dove_matriarch_title:0 "The Dove Matriarch"
 A3A_dove_matriarch_desc:0 "It is all well and good that one of us has sat upon the Dove Throne, but it would be a shame to watch that honor slip away from us. We must find our way into the courts of each elector and, if possible, their beds."
 A3A_dove_matriarch_tt:0 "We will send an ultimatum to §Yall electors:§! Name one of our sisters as your heir or suffer the consequences!"
 A3A_heart_of_power_title:0 "Heart of Power"
 A3A_heart_of_power_desc:0 "Ruling the Empire alone is not enough. We must consolidate our control over these lands and establish ourselves as the preeminent rulers of Cannor.\n\nTo the West lies the grand Kingdom of Lorent. For centuries, they have been the de-facto center of power in Cannor, and their interventions have swayed the fate of the Empire countless times before. We must ensure the rose is tended only by a gardener of our choosing."

 # column 5
 A3A_challenging_gnolls_title:0 "Challenging the Gnolls"
 A3A_challenging_gnolls_desc:0 "For too long, ravenous gnolls have occupied the peaks of the Khenak Mountains. Wyvernmark has historically been too weak to stand up to these beasts, but now it is clear that the gnolls are on the back foot. We must take this opportunity to secure the mountains before the treacherous Businori get the chance.\n\nOur overlords in Verne have forbidden us from attacking the gnolls ourselves, but that is no matter. A simple provocation is all it takes to get the war started regardless."
 A3A_Khenak_Roost_title:0 "A Khenak Roost"
 A3A_Khenak_Roost_desc:0 "Though harpies of The Convent may lack wings, they nevertheless still yearn for the mountains. Thankfully, no one worth caring about lives in those mountains, so it should be easy work to clear space for some lovely new roosts."
 A3A_feather_pillows_title:0 "Feather Pillows"
 A3A_feather_pillows_desc:0 "The great houses of Cannor are families of such prestige and dignity that it would be a shame for their children to go to sleep on a hard surface, wouldn't it?\n\n'In fact, milord, I believe your son deserves only the highest-quality pillows Cannor can provide. Fortunately, it just so happens that Wyvernmark has an unexpected oversupply of the most exotic and soft feathers you've ever laid eyes on.\n\nIf you don't mind, perhaps I could deliver these pillows to the Prince myself?'"
 A3A_feather_pillows_tt:0 "§CEvent Insight:§! We will gain the ability to assassinate the heirs of certain nations."
 A3A_securing_empire_title:0 "Securing the Borders"
 A3A_securing_empire_desc:0 "The growth of Wyvernmark has rendered the Empire's southern frontier all but impregnable. The same, however, cannot be said about the eastern border. The Wexonards have been reticent in their duty to secure these lands. We must take into our own hands to keep the Empire's borders secure.\n\n'Do not mind the army marching through your lands, my dear Wexonard friend. You wouldn't want a repeat of the first Xhazobine, would you? Another monstrous horde overrunning your homeland?'"
 A3A_ancient_home_title:0 "Our Ancient Home"
 A3A_ancient_home_desc:0 "We have never forgotten. We will never forget.\n\nThousands of years ago, our foremothers flew high above the peaks of the Godshield Mountains. Thousands of years ago, we were free. Only by the hand of the accursed Beastbane were we driven out of our homes and forced into a shameful exile in Sarhal.\n\nNo more.\n\nThe Godshield and the lands of the old Dostanorian Dominion shall come under our control and once again we will reclaim our birthright.\n\nOnce again, we will have our honor."
 A3A_ancient_home_tt:0 "§CEvent Insight:§!\nWe will bring our sisters to repopulate our ancient roosts along the Godshield."
 A3A_path_east_title:0 "Old Hunting Grounds"
 A3A_path_east_desc:0 "Before it was Daravan's Folly, it was Cardest. Before Cardest, there was the Castanorian Dominion of Dostanor. Before Dostanor, this was all part of the Oldwoods, our hunting grounds. Once, our ancestors flew from their roosts to swoop down on prey all across this region.\n\nAll of that was stolen from us by the accursed Beastbane, whose legions burned the forests and looted our nests. The people there go by a different name from those who drove us out, but they are Castan's people all the same. We must bring these lands under our dominion and ensure our newly restored roosts are never threatened again."

 # Part 3
 A3A_rebuilding_trust_title:0 "Rebuilding Trust"
 A3A_rebuilding_trust_desc:0 "The crisis might have subsided, but our human neighbors will not forget what they have learned. We are monsters who have decieved them for so long, and with the masquerade shattered our only option left is to convince them that what we really are is something worthy of respect.\n\nIt's a jarring shift, both for the humans and for ourselves, especially considering how insistent the Convent was on reinforcing this idea of our 'monstrosity.' Still, it is clear now that the concept of 'monstrous' nations is becoming increasingly a thing of the past."
 A3A_combined_wings_title:0 "Combined Wings"
 A3A_combined_wings_desc:0 "As relations slowly normalize between our harpy and human populations, a strange idea has occurred to some of our military planners.\n\nAlthough we had maintained a strictly human military for generations in the interest of maintaining the masquerade, the tactics we have encouraged in these human soldiers were often drawn from traditional harpy practices. Add in the number of men we've trained to ride wyverns into battle, and the result is an army of humans uniquely suited for fighting alongside harpies.\n\nBy integrating both harpy and wyvern-mounted aerial units with our ground-based infantry, we can create a much more cohesive fighting force."
 A3A_own_wings_title:0 "Wings of Our Own"
 A3A_own_wings_desc:0 "Generations of the Convent's rule have left the harpies in our realm bitter and resentful. One thing above all weighs on their minds -- wings.\n\nThe fall of the Convent has meant that future generations of harpies may yet be able to retain the wings they were born with, but no amount of reconcilliation would regrow wings for the older generation.\n\nSome, however, refuse to let that be the end of the story. Artificery, an arcane art popular among the gnomes of the Empire, promises to make magical devices with limitless possibilty. While these newfangled toys are not a priority for the state budget, these harpies are seeking considerable private investments from merchants and adventuring guilds alike. Could they find the breakthrough that lets them soar?"
 A3A_mid_flight_tinkering_title:0 "Mid-Flight Tinkering"
 A3A_mid_flight_tinkering_desc:0 "Artificery is all the rage now, and the dissemination of these new flying machines has inspired countless harpies under our rule to consider taking up the art. Their enthusiasm is appreciated, but one wonders if they might be a little too enthusiastic. Just the other day, some poor bird careened into the palace after trying to tinker with her flying machine as she was using it.\n\nSome advisors have called for restraint, others urge us to abandon our support for this reckless pursuit altogether. We might just wait and see, though. That same one who crashed is the one who made the self-oscillating fan in the matriarch's quarters; she deserves some leeway."
 A3A_wings_title:0 "Wings"
 A3A_wings_desc:0 "The Convent is gone, the war is over, and at long last the realm is once again at peace. Now, the new administration has an arguably more difficult task.\n\nWe must pick up the pieces, stabilize the realm, and demonstrate to all of Cannor that we will hold true to the beliefs that brought us to power. Whether the people like it or not, [Root.GetName] is a nation ruled by harpies, and for the first time...\n\nWe will spread our wings."
 A3A_extraterritorial_title:0 "Extraterritorial Privileges"
 A3A_extraterritorial_desc:0 "An integral part of the Convent's rise to power was an intricate web of strategic marriages and assassins who would secure the succession for their handpicked heirs. All of this, of course, was conducted under strict secrecy as part of the Convent's mission. Now, we have no need for such secrecy any more. Everyone knows now that our 'princesses' are harpies, yet they accept the betrothals regardless, in deference to our strength.\n\nThe nations of Cannor may complain, but they would not dare lay a finger on a [Root.GetAdjective] diplomat. No matter what brazen acts said diplomat might commit."
 A3A_the_west_title:0 "Pacifying The West"
 A3A_the_west_desc:0 "Before the fall of the Convent, their sights had been set on what would be the crown jewel in their collection, the Rose Kingdom of Lorent. Long a thorn in the Empire's side, securing Lencenor under our domain would remove the largest threat to our rule in Cannor, while also providing a gateway to the riches of Aelantir."
 A3A_flying_high_title:0 "Flying High"
 A3A_flying_high_desc:0 "With the bulk of Cannor under our wings, the time is nigh for us to make good on our ambitions.\n\nWe have soared to heights that Istárt'a and her sisters could only dream of when they landed on the shores of Wyvernmark back in 1430. We have established dominance over Western Cannor, and rebuilt our ancestors' roosts in the Godshield.\n\nAll that remains now is to end the legacy of the beast once and for all. The people of Castan, and his land of Castanor, must know that, while it has taken millennia, the beast's plan has backfired. We are here to rule, and we are here to stay."
 A3A_swaying_powerful_title:0 "Swaying the Powerful"
 A3A_swaying_powerful_desc:0 "The radical policies of the Doves may have won the argument, but the realities of administering an empire such as ours make pure harpy supremacism an exercise in futility.\n\nTo rule Cannor, we must win the support of those powerful individuals who hold the keys to power. In particular, the Empire is home to a wealth of talented mages and clergy, each with the ability to compell crowds to do their bidding. A couple crowns in the right hands, and we can have that influence all to ourselves."
 A3A_persuading_masses_title:0 "Persuading the Masses"
 A3A_persuading_masses_desc:0 "Even though we might have a solid grip on the levers of power, our subjects have been awfully unruly as of late. Those races who thought themselves as 'civilized' chafe under our rule, and there are no doubt thousands of rebellious groups out there seeking to return these lands to the rule of humans and elves.\n\nWhile it certainly does not displease us to see the people of Castan feeling disgruntled and marginalized, this belligerency is a headache we could most certainly do without.\n\nIt would make things much easier if we could enlist the help of our mages and convince these subjects of ours that their place is in the shadow of our wings."
 A3A_the_hills_title:0 "The Hills"
 A3A_the_hills_desc:0 "Overnight, our realm went from one of many cannorian human empires to the world's largest harpy queendom. This news has not been received well in Bulwar, where uptight birds in shabby roosts claim to be the true heirs of 'Harpylen,' and the rightful matriarchs to which all harpies must pledge their loyalty.\n\nAt this rate, someone ought to head over to these 'Harpy Hills' and put a stop to that intolerable screeching."
 A3A_final_queendom_title:0 "The Final Queendom"
 A3A_final_queendom_desc:0 "It is often said that harpykind has its origin in the hills of Bulwar. While our flock has never felt a strong connection beyond our ancestors who roosted in Escann, that history still holds tremendous importance for our cousins in those hills.\n\nShould we take the palace at Heunthume, we will destroy any legitimacy the squabbling flocks of Bulwar hold to the legacy of their beloved 'Harpylen.'\n\nWe will put an end to their farce of a 'queendom,' and maybe then they will stop looking down on us."
 
 #100 events - Part 1
 wyvernmark.100.t:0 "The Convent"
 wyvernmark.100.d:0 "She wore a long-sleeved black dress that dragged across the floor. White gloves that left nothing exposed. A veil that covered everything but her face.\n\nShe arrived several years ago as part of a group of women people called 'The Convent,' though they never let on what god they served. Even now, long after Istárt'a and I married, her 'Sisters' still remain an enigma.\n\nThey came from the South, she had said once. From the land of Akasik, ravaged by ferocious gnolls. Every day I see her, it aches me that Wyvernmark is too weak to do anything about those beasts. If only I was a greater ruler. If only our land had the resources to mount an expedition.\n\nIf only the spirit of Castan II flowed through my veins, I wouldn't hesitate to be the first on the beaches to liberate her homeland.\n\nAlas, my dear Istárt'a has persuaded me to keep my calm. She is safe now, here in Bronzewing Hall. Her 'Sisters' all employed as handmaidens in the castle. Some of them have even found husbands and built families. It delights me to see their children -- all daughters, by some funny coincidence -- run about the castle grounds, never to know the cruelties of the monsters their mothers escaped.\n\nIstárt'a and I have three daughters of our own, each one precious and talented beyond belief. She and I have supported each other through thick and thin, and every night I whisper the same words of gratitude in her ear:"
 wyvernmark.100.a:0 "My dear Istárt'a, I will love you until my dying breath."
 
 wyvernmark.101.t:0 "Scars"
 wyvernmark.101.d:0 "I rarely get the opportunity to see Istárt'a beneath her robes. Even in bed, she is remarkably modest. Still, over these years, I've seen enough. Her skin is marred with horrendous scars.\n\nThey are relics, I believe, of the life she and her 'sisters' lived on the other side of the Divenhal. Reminders of the wanton and inexcusable cruelties of the gnolls, a race the gods should never have allowed to exist.\n\nMost prominent of her scars is a pair of wide pus-filled gashes running down her back, from her shoulders to her waist. She always refused to let me look at them, so it is only from our embraces that I know the extent of her injuries.\n\nWhen first I noticed those scars, I declared that I would sail down to Akasik and slay the beasts myself! She only smiled in reply.\n\nThat was years ago. Now, our eldest daughter Astúria is thirteen, and today marks her debut into public life.\n\nI've ordered the finest dress for her, and although she insists on wearing the same gloves and veil her mother does, she looks as if a true princess has come to grace this backwater realm of Wyvernmark.\n\nShe greeted the visiting dignitaries with grace far beyond her years, and even when a boorish man lifted her veil to sneak in a kiss, she told him off with such propriety and authority, I was almost ready to abdicate and declare her Margravine on the spot!\n\nHold on, when he lifted her veil, for just the briefest moment... Were those scars I saw on her back? Scars almost identical to her mother's?"
 wyvernmark.101.a:0 "No, I must be imagining things."
 
 wyvernmark.102.t:0 "A Gift from a Loving Wife"
 wyvernmark.102.d:0 "If the slavers who took her were human, perhaps they may have only clipped her flight feathers. That way she would have been able to keep her pride, even if robbed of her flight.\n\nIn a sense, it was fortunate, then, that it was gnolls who enslaved her instead.\n\nIstárt'a may have worn a habit, but she was no nun. Her sisters in 'The Convent' worshipped no god. They were birds who had migrated from the south to build a nest in these mountains. 'Stonewings,' they were called, although all her sisters now lacked any visible wings. It was fate's penchant for irony that allowed them to survive -- the cruelty of those ravenous beasts who enslaved them was the only reason they were now able to pass themselves off as an eccentric group of human women.\n\nTheir grudge against the gnolls was obvious, but it was the humans who truly earned Istárt'a's ire. For centuries, her people have lived in harmony alongside the humans of Akasik, but every last one of those smoothskin land-walkers only averted their eyes as the gnolls paraded her and her sisters through the streets in chains. It should have come as no surprise -- humans have always been the most treacherous race. Were it not for the humans and their 'heroes,' the Stonewings would still soar the skies over the mighty Godshield Mountains, living according to the ways of the Old Hunt!\n\nYet, when the lord of this backwater fiefdom asked for her hand in marriage, Istárt'a did not refuse him. She did not love him, not at all. Nor was she forced into the arrangement. No, she hated him and all his people, and this marriage was her way of revenge.\n\nPerhaps poor Roger might have felt it strange that she only ever bore him daughters, but it was far too late for him to do anything about it. Their eldest, Astúria -- sheared of her wings at birth to maintain the masquerade -- would soon be coming of age.\n\nTonight, Istárt'a will enter the lord's chambers as she always had, and she will expose her secret. Roger will know that the woman he married is a monster. He will know his bloodline will only live on through monsters."
 wyvernmark.102.a:0 "And he will take those secrets to the grave."
 
 wyvernmark.103.t:0 "First of Her Name"
 wyvernmark.103.d:0 "Today is the day.\n\nToday, I will take my father's throne and wield the ceremonial mace as Astúria I, rightful Margravine of Wyvernmark. The first of my kind to rule in Western Cannor since the days of Beastbane. Yet, amid all the festivities, my hand reaches to the skin on my back.\n\nThe scars, the stumps of a limb I never knew. I was never meant to rule; I was meant to fly.\n\nFor all my life, I have cursed my mother and the handmaidens who stole the sky from me. I spurned them. Shouted at them. Made preparations to run away from the castle and join an adventuring band.\n\nWhen I was caught halfway out the door, my mother took me to watch a parade hosted in honor of our recent victory over the gnolls. Images of Beastbane abounded as effigies of gnolls, orcs, goblins, and -- yes -- harpies were beaten and burned in the festivities.\n\n'See how they hate you. See how they wish you dead. These are your people.' On that day, my mother leaned in close, her lips brushing against my ears as she whispered. 'You will rule over them, and your daughters will one day rule over all of Castan's people. Do not mourn what I have stolen, for you will fly far higher than some paltry wings could ever take you.'\n\n'Let others wage war,' she said."
 wyvernmark.103.a:0 "You, harpy Astúria, marry."
 
 wyvernmark.104.t:0 "The Long Game"
 wyvernmark.104.d:0 "'[Root.Monarch.GetName], I'm scared.'\n\n'Have pride in yourself, sister.' I pulled the laces of her gown tight. She winced as the fabric tugged against her wing-scars, but she did not voice her displeasure. 'We have already damaged the old Duchess' reputation beyond repair. You bear his child. He will have no choice but to accept you.'\n\n'I- Yes, I know that. You've said that enough times. But you want me to stay in Verne? To show myself before the court every day? To live with that man!?' Despite the thorough training I and the rest of the Convent have put her through, she seemed awfully unwilling to perform the duty she had been trained for. It was too late now to change the plan. The Duke knew her face -- the Duke loved her face. If he hadn't, she would not have been able to seduce him at that banquet last year.\n\nA junior sister presented a shawl and veil, and I threw them upon the bride-to-be. 'This is your duty,' I told her, 'Surely you understand what is at stake.'\n\n'I know! I know!' She practically whimpered. 'But still...' She lifted the hem of her dress, exposing her feet that had yet to receive the strict cloth bindings and tall boots that awaited her on a table nearby. While the sharp talons that would have graced her toes were removed before she could ever remember them, the avian scaly texture of her feet would betray her heritage to any who could see them. 'What if he finds out? I was so scared the first time... How am I supposed to keep the secret for years?'\n\nWeakness. I grabbed both of her shoulders from behind and pressed my thumbs hard into her wing-scars. 'You *will* keep the secret.' I chastised as she screamed involuntarily. 'If you are such a fool to let your secret slip just because you spent too much time with a man, then my faith in you was misfounded. Know that countless harpies before you have burned at the hands of these men. He is not your lover, even if you are his. If he ever manages to find out...'"
 wyvernmark.104.a:0 "'My sister, you already know what you must do.'"
 
 wyvernmark.105.t:0 "A New Kind of Roost"
 wyvernmark.105.d:0 "'Harpies. A monstrous avian race that, thanks to their gift of flight, builds roosts high up in the mountains where land-bound races like humans would be unable to disturb them. Should you ever find yourself in an area of probable harpy activity, dear reader, stay on high alert. Once the harpy has you in her claws, you will never be able to escape the roost.' -- Excerpt from 'Beasts of Halann and All Their Terrible Forms'\n\nNaturally, the author of this book was unaware that he lived in a country ruled by those very harpies. Unlike the poorly-informed fantasy he describes, however, the harpies of The Convent find themselves just as hampered by the curse of gravity as he. Nonetheless, it would be extremely advantageous were they to have a roost of that sort. A self-sufficient city in the mountains where outsiders could not enter, and insiders could not leave without the Matriarch's approval.\n\nUnlike the grand roost at Heunthume, or even their mothers' old nests in Akasik, this would not be a home perched on the cliffside with no ladders up. This roost, the Enneutía, would be more subtle. More... terrestrial. It would look less like a bird's nest and more like a small mountain village, shielded by high walls on all sides with all access funneled through a single gate. Unlike other harpy roosts, this will have no harem. No men -- nor women, for that matter -- will be permitted inside, under any circumstances. Instead, the centerpiece will be a large hatchery, flanked by locked dormitories to house the expectant mothers. A chimney at the back belches a putrid black smoke, but life in the roost carries on.\n\nThere is a school, where hatchlings will learn the ways of nobility. There is a chicken coop and beehive, to encourage self-reliance. To the humans around, this roost would be assumed to be little more than an ordinary monastery tucked away in the mountains."
 wyvernmark.105.a:0 "Or, perhaps, a Convent."
 
 wyvernmark.106.t:0 "A More Welcoming Profession."
 wyvernmark.106.d:0 "'They say harpy culture has no gender, yet The Convent insists we all live as women.\n\nFrom my birth, I was taught that men were uncivilized brutes who would kill us on sight if we disobeyed any of The Convent's teachings. That I was to behave as the ideal woman at all times, for to break from that mold would mean certain death.\n\nI hated it. That alone did not make me unique. Every sister bemoaned the loss of their talons and cursed the names of the sister wing-shearers who robbed them of their birthright. All of them spoke of a fanciful future where harpies like them would be free to soar the skies unmolested. A future where the humans knew their place -- disarmed, only able to stare up at the majesty of our superiority.\n\nThat vision, however, did not make my heart sing as it did my sisters'. They told me stories of adventurers and their deeds as a cautionary tale, yet I only grew more curious. Who were these men? What drove them to devote themselves to live a life of such danger? More importantly, if a harpy can perform the role of a noble lady, could we not become a gallant man just as easily?\n\nRather than go off to marry some creepy old noble, I donned a full-face helmet and signed up for a party of amateur adventurers. So afraid was I of being discovered that I didn't speak once for the whole first mission.'Alvar the Mute,' they called me. It wasn't my name, and yet my heart raced more than it ever did when I was called the name The Convent gave me.\n\nContrary to the stories I'd been told, these men were not foaming at the mouth, nor thirsty for blood. They approached the quest-giver, a frail old widow tending to a modest farm, with the utmost grace and courteousy. In spite of their bravado, these men almost fainted when a wild boar stood between them and the herbs we needed to collect. And, when the job was finished, the captain patted me on the shoulder. 'Alvar, you're a good man,' he said, and I knew at once that this was where I belonged.'\n\n-From the journals of Alvar the Mute, proud Vernman adventurer."
 wyvernmark.106.a:0 "These fools can't be stopped. Might as well use them."
 
 wyvernmark.107.t:0 "He Who Fights Monsters"
 wyvernmark.107.d:0 "Adventurers. The bane of any whom these self-absorbed brutes deem to be 'monsters.'\n\nIt is just our luck that we have established ourselves among the Vernmen, of all nations. These muscular mustached braggards are famed across Cannor for their reckless enthusiasm and complete lack of self-preservation in the face of even the most dire odds. Some of my sisters find their spirit admirable, and not a few have asked for my blessing to allow them to marry one, but I have forbidden it. Sending my sisters to the palaces of airheaded nobles is one thing, but I would never send my sister into the home of some mustached barbarian who would turn her head in for a sack of gold and an embellished tavern story. Not to mention, the thought of such a union producing a mustached harpy makes my wing-scars ache in disgust.\n\nNevertheless, I cannot deny that these fools are a useful asset. Den of gnolls causing us trouble? A rebellious flock refuses to abide by the Convent's norms? Just invite a party to the palace and have some 'princess' butter them up. 'Oh gallant warriors,' she might say, 'Won't you please save my people from a horrid beast that terrorizes the lands?' and they would chomp at the bit to do our bidding.\n\nHowever, as of late, it appears that these barbarians have begun growing weary of our requests. Perhaps they recognize that our intentions are less than genuine. I worry it won't be long before one of them remembers they have a brain in addition to that gaudy mustache and recognizes that their enthusiasm for fighting monsters has only led them to do the bidding of those very monsters.\n\nNo matter, preparations are already in order.\n\nThe next adventuring party to visit the castle will receive a warm welcome. A chorus of talented songstresses will line the walls of the audience chamber. I personally will address our 'heroes,' heaping praises regaling them with talk of gold and glory. Before they realize it, the geas of loyalty from our best riavélt'i songstresses will have already taken effect."
 wyvernmark.107.a:0 "For monster hunters, you're awfully bad at recognizing one."
 
 #200 events - part 2
 wyvernmark.200.t:0 "Backwater no More"
 wyvernmark.200.d:0 "I took a deep breath. The palace guard before me seemed to be just as surprised as I was that I was here. I hadn't been invited, and were this a few years earlier, the guard would have thrown me out of the window like I was the contents of the imperial chamber pot.\n\nFor centuries, Wyvernmark has been regarded as an irrelevant stretch of mountains on the far edges of the Empire. You would be hard-pressed to find anyone in Anbenncost who could even identify it on a map.\n\nNo longer.\n\nEven though I had not been invited to the imperial court, this guard knew me. Everyone knew [Root.Monarch.GetTitle] [Root.Monarch.GetName]. To refuse me an audience with the Emperor would invite grave consequences indeed.\n\nSince the Convent took power, Wyvernmark has grown to eclipse our historic overlords in Verne. Now, when [Root.Monarch.GetName] enters the hall of the Imperial Palace, everyone turns to look. They do not know that a monster walks among them, but they will learn to fear me all the same.\n\nToday, I has but one demand for the diet -- A title. A title worthy of Wyvernmark's new status.\n\nNo more shall I be regarded as a common Margravine. No longer am I some mere border prince who stares out at the mountains while the important houses decide the fate of the Empire. There will be no choice -- I will be an elector."
 wyvernmark.200.a:0 "From today onwards, I will be an *Arch*-Margravine."
 
 wyvernmark.201.t:0 "Return of the Stonewings"
 wyvernmark.201.d:0 "In the distant past, our ancestors abandoned their roosts on the Godshield mountains, fleeing the terror of Castan's brutes to seek the promise of safety across the sea. There, in the hills of sunny Akasik, our foremothers thought they could build a co-existence with the local humans.\n\nIn the recent past, our mothers once again abandoned their roosts. This time, fleeing the terror of a pack of mangy gnolls who ravaged our homes and enslaved us. The Akasi said they would avenge us, but what good did their promises do? We had to win our freedom by our own hands. Following the winds of our ancestors, we flew across the Divenhal to seek refuge. But this time we weren't so naïve.\n\nBy our own hands, we have dominated Wyvernmark.\n\nBy our own hands, we have liberated Akasik.\n\nNow, we must finish the job. The gnolls are little more than ragged hairy beasts -- We will avenge our mothers and drive out every last one of them. The humans, who failed their commitment to help us, must make way to ensure none can ever threaten our roosts again.\n\nThe hardest part, to our surprise, is actually our newly liberated sisters. The matriarchs of each flock showed little interest in our generational plan to exact revenge on the people of Castan. Their attitudes were even more hostile when they learned the ways of our Convent. No amount of persuasion would convince the local harpies of the necessities of the veil and the Sister-Wingshearers. According to them, our ways stand in opposition to everything Stonewing Harpy culture stands for.\n\nAfter all we've done for them, these stubborn ingrates fail to see why the survival of our race depends on these methods!"
 wyvernmark.201.a:0 "Our sisters will be liberated, whether they want it or not!"
 
 wyvernmark.202.t:0 "The Death of a Culture"
 wyvernmark.202.d:0 "'There are no more harpies in Akasik.'\n\nThat is the word on the street. The Vernmen say it with pride and a twirl of their luscious mustaches. The Akasi say it with rage, cursing the oppressors of a group they could barely lift a finger to protect. Most intriguingly, the harpies themselves, they say it too. To the Stonewing harpies of Akasik, these words carry a different meaning.\n\nTo be a harpy is to be free. It means to fly, and to sing. To pursue one's hunt out of nothing but one's individual dedication. But now, robbed of their wings, forbidden from singing in public, and dolled up like some common human woman... Though they remain alive, they are no longer harpies.\n\nSuch complaints do not bother us, however. Our armies have Akasik under our thumb. Their roosts and their hatcheries are operated by sisters of the Convent. Their isolent resistance has been stomped out, and their children will be educated to maintain the masquerade with decorum like their sisters in Cannor are. Our Sarhaly sisters may have been troublesome at first, but now they will serve their duty in service of our grand plans.\n\nThe Convent's mission of dominance has long been hampered by our limited numbers, but now with all of our stonewing sisters at our service, we can produce enough 'wives' to keep a much closer eye on our subjects."
 wyvernmark.202.a:0 "Whatever they think of it, our sisters will be of great use to our cause."
 
 wyvernmark.203.t:0 "A Complaint from the Headmaster"
 wyvernmark.203.d:0 "'To your excellency, [Root.Monarch.GetTitle] [Root.Monarch.GetName],\n\n'We at the mage tower of Bronzewing Hall are eternally grateful for your patronage. Your investment in the arcane arts will surely bring great boons for our realm. In accordance with the conditions of our arrangement, we have graciously accepted the talented young students you have sent as apprentices. I am pleased to inform you that these students have a tremendous enthusiasm for magic and have already learned a great deal.\n\n'However, I do feel it is necessary to inform your excellency that some of our students and faculty have lodged complaints pertaining to one of those students, a young woman named Tía. She is incredibly studious and a very promising young mage, but her habit of perching on tree branches and singing shrilly in the middle of the night has had a profoundly negative effect on our faculty's sleep schedules. Furthermore, she has displayed unnatural aggression towards her male peers, frequently leaping onto their shoulders from above and dragging them into the trees.\n\n'I understand that you care deeply about her prospects as a mage, and we have let these incidents slide thus far in respect of your directives, but you must understand that she would have been expelled by now had she not benefited from your excellency's favor.\n\n'Please, even if you are unwilling to withdraw her from the mage tower, would you please at least use your influence to get her to behave?'"
 wyvernmark.203.a:0 "She stands out too much, make her drop out!"
 wyvernmark.203.b:0 "Her talents are to valuable, let her continue her studies."
 
 wyvernmark.204.t:0 "Expanding the Convent's Reach"
 wyvernmark.204.d:0 "My entourage and I arrived at this palace unannounced. By the standards of Cannorian nobility, this would be unthinkable, but everyone was well aware that our visit was not to be refused.\n\nSister Mus'téz, known to the humans around here as Countess Margherita, was nominally the legal lord of these lands. Her father had been Count, and upon his death, his sole daughter inherited the crown. The land was rightfully hers, by the grace of the gods and the Emperor. To the common peasantry, and even perhaps to the burghers, there was no reason to question that natural assumption.\n\nLaws of primogeniture and feudal domain are not the way of our Convent, however. We are a strict matriarchy, by the rule of ancient harpy tradition... Or at least, by our version of it. We would not expect a sister of ours to forget her education or the debt she owes to the matriarch who created this opportunity to her. Yet, it would be negligent of us not to make sure.\n\nMus'téz always cared unnaturally for her father, and when I walked in, the first thing I saw was her conversing gleefully with a human advisor who had served that father for decades. She nearly fell out of her seat when I and my robed companions entered the room. From the look in her eyes, I wondered if she perhaps recalled the sight of the Sister-Wingshearer looming over her when she had just hatched.\n\nYes, that was as it should be. I am the matriarch of the Convent. She, for all her fancy titles and human admirers, is naught but a chirping chick before me.\n\nThat favored advisor of hers would have to go. I informed Sister Mus'téz that the loyal sisters who arrived with me would replace all of the humans in her orbit. The 'Countess' would be entirely isolated from her 'subjects,' lest she forget that her domain is no longer a typical human realm."
 wyvernmark.204.a:0 "All that's yours is the Convent's."
 wyvernmark.204.tt:0 "Enables a decision allowing us to convert our personal unions to adopt our §Yculture and government§!."
 
 wyvernmark.205.t:0 "Becoming the Throne"
 wyvernmark.205.d:0 "When we first set out to take the Dove Throne, many in the Convent thought nothing of what it meant to administrate an empire such as Anbennar. The objective was one of power and domination, little more.\n\nNow, however, the Empire has become as much a part of us as we have of it. Hatchlings born in our Enneutíai to unknown fathers are now educated in administration, politics, and engineering so that they may serve roles in the imperial administration. Naturally, they cannot replace all of the intertwined levels of bureaucracy and feudal loyalties that comprise the Empire of Anbennar, but by entangling the Convent's hierarchy with the human administration, we have made our rule an inseperable part of this land's traditions.\n\nThe more conservative among our sisters decry these developments. 'Were we not to have our revenge against the people of Castan?' They shout, 'Since when have we become nothing more than secretaries, working for the very people we ought to be destroying? This is not rule, it's service!'\n\nPerhaps they are correct, but however much we fight the pull of administrative tedium, it occupies more and more of our duties regardless. Our goal is unchanged -- some day, we will retake what the beast has stolen from us. Some day, the people of Castan will suffer the same injustice they imparted upon us those thousands of years ago. Yet, in the face of the enormity of human society in Cannor, the wanton aerial raids of our ancestors would be as effective as a sparrow pecking at the hide of a great lion. If we wish to rule humanity, we must rule with the tools that humanity has been so gracious to offer us."
 wyvernmark.204.a:0 "Pass me my pen, I have some grain quotas to adjust."

 wyvernmark.210.t:0 "The [From.Monarch.getTitle] Doubts Our Succession"
 wyvernmark.210.d:0 "A missive arrived yesterday from [From.Monarch.getTitle] [From.Monarch.getName].\n\nIn it, [From.Monarch.getSheHe] expressed doubts about our line of succession.\n\n'As an Elector of our proud Empire,' the letter opens, 'to allow someone without Imperial ties claim the title of Elector would bring great shame upon your domain and reflect poorly on the Empire's reputation.'\n\nThe [From.Monarch.getTitle] demands we install [From.Monarch.getHerHis] chosen candidate as our successor. Said candidate is a young woman from a distant branch of our family who is known for her conservative style of dress and secretive personal life -- traits she shares with the [From.Monarch.getTitle]. It is not hard to imagine why she was chosen."
 wyvernmark.210.a:0 "Yes, Your Imperial Highness. She will rule."
 wyvernmark.210.b:0 "Some letter can't uproot our laws and customs!"
 
 wyvernmark.211.t:0 "A Protest from Gaweton"
 wyvernmark.211.d:0 "'[A13.Monarch.GetTitle] [A13.Monarch.GetName] of Gawed finds the recent actions of the [Root.GetAdjective] crown to be most concerning. This senseless aggression on display in Lencenor has deeply disturbed the fragile balance of power in Cannor. [A13.Monarch.GetName] wishes for peace to prevail, but this unnatural consilidation of power in [Root.Capital.GetName] may pose an existential threat to [A13.Monarch.GetHerHis] kingdom and [A13.Monarch.GerSheHe] may be forced to take action.'\n\nSuch was the contents of a letter delivered to us by a haggard courier late last night. One might expect, given the centuries of rivalry Gawed has shared with Lorent, that they would be pleased to see Lencenor coming under our influence. That assumption was evidently incorrect. It may be little more than a sternly-worded letter for the time being, but the men of Gaweton have made their position clear. Only they will be allowed to subjugate Lorent."
 wyvernmark.211.a:0 "They can complain all they want. Let me know when they actually do something about it."
 
 wyvernmark.212.t:0 "Roosts of Our Foremothers"
 wyvernmark.212.d:0 "'This is it. Or what's left of it, at least.'\n\nWhen I was but a hatchling, I imagined what it would be like when we finally retook the Godshield. Winged trumpteers blaring the news of our triumph for all the world to hear. A grand procession of my sisters and the soldiers at our command marching across Dostanor, heads held high as we reclaimed the great works of our foremothers. Reality, however, refused to bend to the expectations of some chirping chick.\n\n'From what my grandpa told me -- and I assume what his grandpa told him -- this here would have been the harem, where the harpies would take their victims and do unspeakable things.'\n\nMy guide, a local shepherd, motioned towards a narrow opening in the cliffside, what looked like little more than a common cave. Stepping inside, I could see signs of habitation -- a depression where a firepit once was, holes drilled for light and ventilation, alcoves carved out to keep personal effects close at reach -- but it was a far cry from the stories my mother had told me. The way she said it, I had imagined a ruined palace whose grandeur exceeded the grand complex of the Firanyans at Heuntheume.\n\n'Were there any others?' I asked. 'Could this have simply been a hunting camp, and the main roost was somewhere else?'\n\nThe shepherd chuckled a little, and I wasn't sure if he was simply good-humored or he thought me a fool. 'Sure, there's others. All up and down this range we've found caves like this where we think the little monsters once made their nests. But -- and I'm sorry to disappoint you, miss -- this one here is the biggest one we've found.'\n\nFighting the primal urge to throw this man off of the cliff for his insolence, I took a deep breath. Perhaps there were other, grander roosts that had yet to be found. Perhaps he was right, and my ancestors were not so grand as I had believed. Or, perhaps all this time ruling over human kingdoms has made us grow complacent, accustomed to human standards of luxury that our ancestors wisely eschewed. Whatever it was, my plans would not change. Surveyors would be out here in the coming weeks, with the first stages of construction following soon after."
 wyvernmark.212.a:0 "What matters is that this was once our home, and it will be again."
 
 #300 events - part 3
 wyvernmark.301.t:0 "Substitute Wings"
 wyvernmark.301.d:0 "'Ignition in three... two... -- Shit! Pérr'ei! Somebody catch her!'\n\nOne sunny morning, I awoke to quite the commotion on the palace grounds. Peering out over the balcony, I could see that Nalofát'u had requisitioned the gardens to conduct yet another of her ridiculous tests.\n\n'Alright ladies, new plan! This time we're gonna try going straight up and gliding back down. Who wants to volunteer?' I watched as Nalofát'u pried her previous test subject out of a large shrubbery and, without even checking to see if she was okay, yanking that peculiar device off of her back and offering it to the next volunteer.\n\nIt was a wonder that anyone was willing to strap such a monstrosity to their back, but I knew all too well how desperate a harpy could get when offered the promise of flying once again.\n\nThe device was a ramshackle thing, hardly sophisticated enough to even qualify as artificery compared to the gnomes' products I have seen. This 'flying machine' was little more than a pair of metal wings made of bronze from rejected cannons. Then, to provide the propulsion, two canisters of weapons-grade damestear were strapped to the user's back, with no safety precautions in sight.\n\n'Alright, this'll be the one! Three, two... Ah, pérr'ei!' The poor volunteer was sent hurdling towards the castle walls, tumbling head-over-heels as she failed to attain anything resembling controlled flight.\n\nThen suddenly, like a hatchling thrown out of her mother's nest, she aimed herself straight at the ground. And just when it looked as if she was due to crash head-first into the audience of researchers and volunteers, she grabbed one of the observers off of the ground and swooped up, soaring towards the sky. With the added counterbalance, her flight was stabilized, and now she soared like the harpy she was always meant to be, albeit with wings of bronze."
 wyvernmark.301.a:0 "Whoosh!"
 
 wyvernmark.302.t:0 "The Final Queendom"
 wyvernmark.302.d:0 "Walking the halls of the Queen's Throne in Heunthume, one can feel thousands of years of harpy history with every step. Statues of the great queens of yore line the halls, surrounded by inscriptions of iconic songs carved by the greatest Mišaran masters. The great harem displayed luxuries to which nothing in my palace could compare, and the throne room opened out to an unparallelled vista over the mountains.\n\nAs I walked these halls, the servants and retainers of the old Queen eyed me with a mix of suspicion and anticipation. Were we any common human or elven occupiers, these harpies may have lashed out or perhaps fled to the hills. But, being a harpy myself, many elected to stay back, anxious to see what I might do. The self-proclaimed 'Queendom' of Ayarallen is no more, and now [Root.getName] is the undisputed pre-eminent harpy power on Halann. Should I so desire, I could take a seat on that throne and declare myself the Queen of Harpylen and no flock would dare dispute my claim.\n\nYet neither I nor my flock had ever cared much for the pretentions of the Firanyan harpies. Our ancestors were the harpies of the Oldwoods. We were free. While the flock of Firanya was living lavishly in palaces like this, we nested in our cozy roosts up on the Godshield, hunting and thriving by the laws of nature. Thus far, the Queen's Throne has been nothing but a thorn in our side, and the Firanyans have consistently treated us with a condescending, matronizing attitude. I could just as easily roll a cannon in here and blow this whole thing to smithereens. That would shut these squawking hens up."
 wyvernmark.302.a:0 "This is the end of the queendom."
 wyvernmark.302.b:0 "We *are* the final queendom!"
 
 wyvernmark.310.t:0 "The 'Pigeons' of [Root.GetName]"
 wyvernmark.310.d:0 "The Convent is characterized by an intense hostility towards humankind, even if they have disguised it well from our subjects. After generations of living in disguise among human families, however, many harpies have grown foolishly attached to their human families and neighbors.\n\nAs time has gone on, these embarrassments to our Convent have grown to concerning numbers. We have taken to calling them 'Pigeons,' birds that have forsaken their nature in favor of an easy but pitiful existence in human cities. Left to their own devices, they surely will become dependent, shamelessly eating out of human hands like pet birds.\n\nThey preach co-existence, but what good did co-existence do to stop Beastbane's legions? All their movement amounts to is surrendering our achievements to the people of Castan!"
 wyvernmark.310.a:0 "These spineless whelps pose no threat."
 
 wyvernmark.311.t:0 "The Dove Compact"
 wyvernmark.311.d:0 "'The Matriarch is weak! The Convent has sold us out to the humans!'\n\nPapers carrying the same message were plastered all over the walls of the Enneutía in Bronzewing Hall. That alone was nothing new. Agitators have been chafing under the Convent's rules for ages. What was new, however, was that the fliers this time were signed.\n\nThe culprits, calling themselves the K'ottipáiq'ádor -- the League of the Dove Oath -- called for an end to the Convent and the masquerade that has defined the lives of every harpy in [Root.GetName]. Unlike the so-called 'Pigeons,' however, the K'ottipáiq'ádor have no desire to get along with our human neighbors.\n\n'It is time we let the people of Castan know just who rules over them! Let us reclaim our birthright and rule all Cannor with an iron talon!'\n\nThe flier minces no words. These impatient fools would discard all of our careful planning -- all of the hard work that has brought us to such heights -- all to taste the catharsis of seeing the humans panic before our talons. Do they forget that we are still a minority by far? Do they forget that our conquest is far from complete?"
 wyvernmark.311.a:0 "I admire the enthusiasm, but these are treasonous words."
 
 #400 events - unique mechanics
 wyvernmark.400.t:0 "An Empty Bed"
 wyvernmark.400.d:0 "The Honorable Baron Blimpleston is a good man. Every day he rides out of the castle to meet with his peasants, and every night he comes back to embrace his loving wife. His life is truly the ideal of how a Cannorian noble should live.\n\nOh no! What's this!? Poor Baron Blimpleston returns home after a long day of caring for his subjects only to find his beautiful wife has succumbed to a sudden and tragic illness! However shall he recover?\n\nFortunately, a spritely young maid from Wyvernmark had recently come to his castle and is more than willing to provide him comfort in these trying times.\n\nFunny how they always seem to be in just the right place whenever tragedy strikes."
 wyvernmark.400.a:0 "I'm sorry for your loss"
 wyvernmark.400.tt:0 "Enables a decision allowing you to §RKill the consort§! of a country you have a §Yroyal marriage§! and §Y50 spy network§! in."
 wyvernmark.401.t:0 "[Root.Consort.GetName] Assassinated!"
 wyvernmark.401.d:0 "The queen is dead! we know who did it"
 wyvernmark.401.a:0 "argh"
 wyvernmark.402.t:0 "Assassins in [From.GetName] Exposed!"
 wyvernmark.402.d:0 "Our dear sister executed the plan just as instructed. She attracted no suspicion upon arrival. In fact the [From.Monarch.GetTitle] welcomed her presence. Yet, at the crucial moment, just as the [From.Consort.GetTitle] of [From.GetName] was to have her 'accident,' a common servant happened to witness our sister holding the strings.\n\nWord got out, and while it was too late to save the [From.Consort.GetTitle], the [From.Monarch.GetTitle] is demanding that we hand over that sister to face justice.\n\nWe will deny that request, of course."
 wyvernmark.402.a:0 "That damned servant!"
 wyvernmark.410.t:0 "Feather Pillows"
 wyvernmark.410.d:0 "Following the late Duchess' untimely death, the Duke quickly found comfort in the arms of a tender Wyvernmarker lady. His son, however, never warmed up to this new step-mother of his.\n\nThe life of nobility can often be cold and isolating, but nevertheless his mother had always been the one comforting presence in that life. In contrast, he could never feel at ease around this new woman. Maybe it was the way she spoke, or the strange black robes she wore at all times. Or, perhaps, it was that look in her eyes that reminded him of a hungry wild beast looking at its prey.\n\nStill, the Duke has lately been encouraging his new wife to reach out to her step-son. She had just the idea -- as it turns out, her hometown is known for producing some of the softest, most exquisite feathers in Cannor. Would it not be wonderful if she were to visit her step-son's room and personally give him a pillow stuffed with these feathers as a token of her good intentions?"
 wyvernmark.410.a:0 "I am sure he will sleep very well tonight..."
 wyvernmark.410.tt:0 "Enables a decision allowing you to §RKill the heir§! of a country with a §Yharpy consort§! and §Y80 spy network§!."
 wyvernmark.411.t:0 "[Root.Heir.GetName] Assassinated!"
 wyvernmark.411.d:0 "They killed our boy!"
 wyvernmark.411.a:0 "argh"
 wyvernmark.412.t:0 "Assassins in [From.GetName] Exposed!"
 wyvernmark.412.d:0 "Our dear sister executed the plan just as instructed. She attracted no suspicion upon arrival. In fact the [From.Monarch.GetTitle] welcomed her presence. Yet, at the crucial moment, just as the [From.Heir.GetTitle] of [From.GetName] was to have [From.Heir.GetHerHis] 'accident,' a common servant happened to witness our sister holding the strings.\n\nWord got out, and while it was too late to save the [From.Heir.GetTitle], the [From.Monarch.GetTitle] is demanding that we hand over that sister to face justice.\n\nWe will deny that request, of course."
 wyvernmark.412.a:0 "Damn it!"
 wyvernmark.420.t:0 "Brazen Acts"
 wyvernmark.420.d:0 "The King thought he had done everything right.\n\nHe had lived a just life, honoring the gods and his ancestors in every fabric of his rule. His subjects were prosperous, and his Kingdom wealthy. And yet, the reward for his virtue was a life of heartache. His beloved first wife passed away in a tragic accident, and his talented and ambitious son met a similar fate a few years later.\n\nHe had nothing against his new wife and the daughter he'd had with her, in fact he loved them both dearly, but recent revelations concerning his second wife's home country of [Root.GetName] put their relationship in a new light.\n\nShe confirmed it when he asked. She -- and his daughter, his only surviving heir -- was a harpy, one with close ties to the ruling establishment of [Root.GetName]. It was a powerful country, no doubt. While he hadn't intended it, perhaps he could leverage this marriage to secure an alliance with them...\n\n...Wouldn't [Root.GetName] stand to gain even more if his country was ruled by a harpy, though? Wait, but in that case, could that have been their plan from the beginning? This whole time, his wife, his son... was all of this just a ruse to..."
 wyvernmark.420.a:0 "'A shame you won't be able to finish that thought, Your Highness.'"
 wyvernmark.420.tt:0 "Enables a decision allowing you to §RKill the ruler§! of a country with a §Yharpy heir§! and §Y100 spy network§!."
 wyvernmark.421.t:0 "[Root.Monarch.GetName] Assassinated!"
 wyvernmark.421.d:0 "they got our guy!"
 wyvernmark.421.a:0 "argh"
 wyvernmark.422.t:0 "Assassins in [From.GetName] Exposed!"
 wyvernmark.422.d:0 "It was planned as a covert operation, but our agent in [From.GetName] must have had other plans.\n\nRather than sneak in and arrange an 'accident,' our assassin chose instead to stand before the [From.Monarch.GetTitle] in a crowded session of court and level a damestear rifle at the [From.Monarch.GetTitle]'s head in front of a hundred witnesses.\n\nAn effective approach, to be sure. There isn't much the [From.GetAdjective] can do about it either. Still, this brazenness will prove a troublesome hurdle to our attempts to bring [From.GetName] under our control."
 wyvernmark.422.a:0 "Be more subtle next time!"
 
 #500 events - Disaster
 wyvernmark.500.t:0 "The Banquet of Pigeons and Doves"
 wyvernmark.500.d:0 "'It's truly a pleasure to have you here, sir. I hope you take a look at the selection of lencori hors d'oeuvres we've prepared --'\n\nThe schedule this time of year is always filled with meaningless social occasions, working tirelessly to please irrelevant human lords far below my respect. And yet, we invite them back every year. To not do so would invite suspicion.\n\nOnce I had successfully distanced myself from that man, I noticed one of my most trusted confidants, Sister Q'aranlát'u approaching with a furious look on her face.\n\n'Ah, Sister, what's the matter? Have the guests--'\n\n'Oh no, nothing like that, [Root.Monarch.GetName]. I just noticed you had a stain on your robes. Here, let me get that for you.'\n\nIn the time it took me to process what she meant by that, Q'aranlát'u had grabbed a fistful of my black, floor-length robes with one hand, and produced a knife with her other. 'Sister! What are you doing!!' My guards reacted, but not quickly enough to stop that knife from tearing my robe wide open. Then, she grabbed one of my boots. This was no assassination attempt -- it was worse.\n\n'Behold!' She cried, lifting my exposed avian leg for all to see. 'Know who rules over you, people of Castan, and despair!'\n\nShe was quickly apprehended, but the damage was done. The guards dragged her away, screaming about 'retribution' and 'destiny' all the while. Then, when she was gone, all eyes fell on me and my bare foot.\n\nThere was no denying it. No covering it up. Today would mark the end of a masquerade that has continued for generations. Everyone present -- human and harpy alike -- had plenty they wished to say. And all the reason to act violently to make their point. Yet, for the briefest moment, the whole room waited for me to break the silence.\n\n'Yes, as you can see, I am indeed a harpy, and...'"
 wyvernmark.500.a:0 "...I wish to build a world where our people can co-exist."
 wyvernmark.500.b:0 "...She was right! The people of Castan will face our vengeance!"
 wyvernmark.500.tt:0 "Initiates the §YPigeons and Doves§! disaster!"
 
 wyvernmark.501.t:0 "The Collapse of the Convent"
 wyvernmark.501.d:0 "For years, the Convent has held an iron grip on all harpies in Wyvernmark. The threat of being exposed and thrown to the adventurers for extermination could bring even the proudest harpy to heel. Now, however, the playing field was suddenly level. Agitators, both from the Pigeon and Dove factions, have stormed Convent institutions and ransacked monasteries and hatcheries.\n\nAcross the realm, once loyal sisters cast aside their veil and robes. Some wives abandoned their assigned husbands, others pleaded for his understanding. Mobs of humans bore down on Convent facilities demanding answers, if not blood. Before long, news spread of one Sister Wingshearer brutally killed at her place of work -- her arms and legs torn from her body with the same shears she had used to sever so many young wings before.\n\nFor all intents and purposes, the Convent and its influence on our society is gone."
 wyvernmark.501.a:0 "And what will stand to replace it?"
 
 wyvernmark.510.t:0 "Radicals Refuse to Cooperate"
 wyvernmark.510.d:0 "While our support for the principle of co-existence and conforming to human customs has earned us much support among the more moderate 'Pigeon' faction, the majority of harpies in our realm are not pleased with our position.\n\nTo those who hatched under the Convent's control, the end of the masquerade represents the chance they had been aching for to break free from the suffocating norms of human society and bring the fight to the people of Castan. When told that they would be expected to continue adhering to those unreasonable human norms and morals, the reactions were instant and intense.\n\nHarpies belonging to the radical 'Dove' faction have taken matters into their own hands, taking control of the roosts and declaring themselves no longer subject to our rule. To make matters worse, bands of these radicals have struck out at surrounding human communities, destroying buildings and demanding tribute in what could only be described as an imitation of what they believed to be harpies' 'natural' behavior. These incidents have not gone unnoticed by our human subjects and neighbors, and no amount of explaining will prevent them from placing the blame on us.\n\nIf we don't address this promptly, it could jeopardize any chances we have at co-existence."
 wyvernmark.510.a:0 "They will understand the error of their ways."
 wyvernmark.510.tt:0 "§RNegates§! the benefits of all §Yharpy roosts§! in our empire."
 
 wyvernmark.511.t:0 "Pigeons Cement Their Control"
 wyvernmark.511.d:0 "Day by day, the administration of our nation changes. With shocking efficiency, legacies of the Convent's stranglehold on government crumble away, replaced by impassioned activists and experienced bureaucrats alike.\n\nIt turns out that many of the systems the Convent put in place to help maintain the masquerade work surprisingly well when allowed to carry out their nominal purpose for real. Human governance is tried and true, and there are plenty of them to fill any role we require so long as we welcome their assistance.\n\nAs a bonus, the humans in our government can go a long way towards assuaging the concerns of our neighbors. Let us employ these men as ambassadors, and prove to the world that if we are to be feared, it would be because we are a great nation, not because we are 'monsters.'"
 wyvernmark.511.a:0 "We take the first step towards becoming a modern nation."
 
 wyvernmark.512.t:0 "Harpies revolt"
 wyvernmark.512.d:0 "'To the wretched [Root.Monarch.GetName], you are a disgrace to your flock!\n\n'For thousands of years, we harpies have plotted our resurgence and revenge against the people of Castan. And now, just as our victory is at hand, you have betrayed your sisters with empty promises of 'co-existence' and 'civilization'! Know that your treasonous ways will be tolerated no longer! We, the proud K'ottipáiq'ádor have assembled a coalition of the great queendoms and roosts of our land. We will remove you and your foolish followers from the power you never should have been allowed to have. Consider this your first and final warning. Our forces are already on the march.'\n\nInfluenced by radical Dove ideology and displeased by our policies of integration, some of our harpy subjects have taken up arms against us!"
 wyvernmark.512.a:0 "Their backwards ways will lead them to their own doom."
 
 wyvernmark.520.t:0 "Discontent among Human Subjects"
 wyvernmark.520.d:0 "As could be expected given our belligerent rhetoric, the humans in our realm -- the people of Castan -- have not taken "
 wyvernmark.520.a:0 "Show them who's boss"
 wyvernmark.520.tt:0 "Adds unrest to all non-harpy provinces"
 
 wyvernmark.521.t:0 "Doves Remake the Administration"
 wyvernmark.521.d:0 "No longer will we pretend to be some silly human monarchy. We will be a proper harpy matriarchy with a harpy army."
 wyvernmark.521.a:0 "We take to the skies!"
 wyvernmark.521.tt:0 "Restructures our subjects to properly reflect their §Yharpy masters.§!"
 
 wyvernmark.522.t:0 "Crusade Against the Monsters!"
 wyvernmark.522.d:0 "Our human neighbors are not pleased to see us embracing our nature."
 wyvernmark.522.a:0 "Crush them under our talons!"
 
 wyvernmark.560.t:0 "Harpy Agitators"
 wyvernmark.560.d:0 "A flock of harpies in [Root.getName] believe we stand between them and the glory of harpy-kind."
 wyvernmark.560.a:0 "Show our errant sisters their place."
 
 wyvernmark.561.t:0 "Human Agitators"
 wyvernmark.561.d:0 "Our human subjects are none too pleased with recent revelations. Unable to stomach being ruled by a monstrous race, they have taken up arms against our country!"
 wyvernmark.561.a:0 "Make it clear who rules around here."
 
 wyvernmark.599.t:0 "The Summit at Bronzewing Hall"
 wyvernmark.599.d:0 "The fires of war have settled down, and representatives from both the Pigeon and Dove factions have been gathered before the Matriarch at her palace."
 wyvernmark.599.a:0 "This is who we are. Now and forever more."
 
 #600 events - Flavor
 wyvernmark.600.t:0 "To Train a Wyvern"
 wyvernmark.600.d:0 "In days long past, the Kings of Verne earned glory on the merits of the legendary Wyvern Riders. Our homeland, Wyvernmark, has been stewards of the surviving wyverns ever since.\n\nA harpy kingdom ought to have a flying army. If we don't have our wings, surely we can find a way to borrow their gift of flight."
 wyvernmark.600.a:0 "Order the adventurers to investigate."
 wyvernmark.601.t:0 "Flying once more"
 wyvernmark.601.d:0 "After long years of work, our adventurers have found a way to reliably get wyverns to tolerate a rider on their back. Their numbers are still low, but with enough effort, we could find a way to use these wyverns to impress our allies -- and our enemies."
 wyvernmark.601.a:0 "We're flying!"
 
 #900 events - Final Boss
 wyvernmark.900.t:0 "A New Age of Monsters?"
 wyvernmark.900.d:0 "With the rise of [Root.getName]'s harpy-dominated Empire, word has been going around that Cannor has descended into a new Age of Monsters. In Escann, where the scars of the Greentide could still be seen around every corner, fear abounded that what had once been a home to humanity would soon be lost forever."
 wyvernmark.900.a:0 "Surely it's nothing to worry about."
 
 wyvernmark.901.t:0 "Beastbane Reborn!"
 wyvernmark.901.d:0 "A man descended from the peak of the Trialmount yesterday, claiming to have cleared the ancient Trials of Castan. His claim is obviously dubious, but he has amassed a tremendous following nonetheless. Styling himself the spiritual successor to Castan II 'Beastbane,' he tells the crowd assembled at the North Citadel that he will lead a Third Great Purge to eradicate the monsters that threaten Cannor once and for all."
 wyvernmark.901.a:0 "This man is out of his mind, his 'Castanor' won't last."

 wyvernmark.902.t:0 "The Beast Enters Castonath!"
 wyvernmark.902.d:0 "Today, the man who proclaims himself the 'Second Beastbane' led an army of disorganized but zealous followers down from the North Citadel onto the streets of Castonath."
 wyvernmark.902.a:0 "Lies! The Patricians would never stand for this!" 
 
 wyvernmark.903.t:0 "The Usurper Demands the White Walls!"
 wyvernmark.903.d:0 "The man who calls himself Castan has sent an ultimatum to the surrounding lords: relinquish their lands to him, the self-proclaimed ruler of a resurgent Castanor, or face the consequences."
 wyvernmark.903.a:0 "There must be an end to this madness!"
 
 wyvernmark.904.t:0 "The Tyrant Seizes Inner Castanor!"
 wyvernmark.904.d:0 "Once again, the self-prolcaimed 'Second Beastbane' has sent an ultimatum to the lords of Inner Castanor."
 wyvernmark.904.a:0 "How could anyone take him seriously?"
 
 wyvernmark.905.t:0 "The Emperor Arrives in South Castanor!"
 wyvernmark.905.d:0 "Following his successes in Inner Castanor, Beastbane II has turned his attention to the south. Lords and warbands alike from Marrhold to the Godshield have received ultimatums to submit to the resurgent Castanor."
 wyvernmark.905.a:0 "We must shore up our defenses before he gets any more ideas."
 
 wyvernmark.906.t:0 "Castan Unites West Castanor!"
 wyvernmark.906.d:0 "Enthusiasm spreads once more among the humans of Escann. The legions of Castanor swell by the day, and now the men of Western Escann are lining up to join their ranks."
 wyvernmark.906.a:0 "They will come for our Empire next. We must prepare."

 wyvernmark.907.t:0 "The Third Great Purge Begins!"
 wyvernmark.907.d:0 "With Castanor reforged, the new legions have been anxious to make good on the promises their Castan made during his rise to power. Purging orcs in Escann can only sate the appetite for so long. If this self-proclaimed 'Second Beastbane' wants to prove himself, he has to come after the empire of monsters whose specter contributed to his rise."
 wyvernmark.907.a:0 "We will show him his is but an empire of sand!"
 
 wyvernmark.910.t:0 "An Ultimatum from Castan"
 wyvernmark.910.d:0 "Castanor is back, and we must relinquish our lands."
 wyvernmark.910.a:0 "Of course Mr. Candor"
 wyvernmark.910.b:0 "No way."
 
 wyvernmark.920.t:0 "The Beast is Slain!"
 wyvernmark.920.d:0 "The North Citadel has fallen. The dream of a resurgent Castanor is dead. If we are monsters, then perhaps the monsters have won."
 wyvernmark.920.a:0 "Castanor will remain as a reminder of our victory."
 
 wyvernmark.960.t:0 "Castan's Followers Take up Arms"
 wyvernmark.960.d:0 "Spurred on by the rise of the 'Second Beastbane's legions in Escann, humans in our Empire have gathered a force to take his agenda into their own hands."
 wyvernmark.960.a:0 "Put them down!"
 
 wyvernmark.961.t:0 "Escann Rallies to Castan's Cause!"
 wyvernmark.961.d:0 "Rebels have risen up in another part of Escann, seeking to join with the legions of the resurgent Castanor."
 wyvernmark.961.a:0 "Another Band of Fools."
 
 #1000 - capstone
 wyvernmark.1000.t:0 "Wings Spread Wide"
 wyvernmark.1000.d:0 "We win. Hooray!"
 wyvernmark.1000.a:0 "Yippee!\n\n§YThanks for playing!§! §G-Jodasgreat§!"
 wyvernmark.1000.tt:0 "Allows the decisions to kill and replace consorts, heirs, or monarchs §Ywithout requiring a royal marriage.§!"
 
 #00 events - Flavor events
 wyvernmark.2.t:0 "Necessary Sacrifices"
 wyvernmark.2.d:0 "There is a fireplace in the hatchery. When the first cracks appear in the shell, a veiled sister dutifully takes a pair of shears and sterilizes them above the flame.\n\nThe mother is confined to her room when her child is ready to hatch. She wails and pounds against the locked door, but no one pays her any mind. This is normal.\n\nWithout a word, the sister lifts the hatchling out of her egg. Before the hatchling can even take her first breath, her nascent wings are severed from her back and placed on a tray. One by one, the sister removes each claw and talon then plucks each remaining body feather.\n\nBloodied and crying, the child is handed to a waiting assistant who wraps her in bandages and takes her away. After a week of recovery, the child will be returned to her mother and only then could the mother return to her husband.\n\nNot even the gnolls would have considered such cruelties -- For all their malice and ferocity, the gnolls are perhaps too hateful to conceive of such a thing. One does not cause harm on such an industrial scale unless they believe it is right.\n\nBut it is right. Every sister is confident in that belief.\n\nEvery member of The Convent must travel here to deliver. No exceptions will be permitted. No outsiders will be admitted. All know that a single misstep will mean the eradication of their race at the hands of the foolish and vindictive humans -- the people of Castan.\n\nTo have their revenge, the harpies must destroy who they are."
 wyvernmark.2.a:0 "One can only hope they forget the pain."
 wyvernmark.2.tt:0 "We will be a §Ymonstrous nation§!, and as long as §YThe Convent§! remains in power, will remain monstrous. However, §Yother nations' opinions§! of us will be as if we were not monstrous."
 
 wyvernmark.3.t:0 "A Warning from the Convent"
 wyvernmark.3.d:0 "'Those humans, they would see us torn limb-from-limb. They would have us eradicated. If you think you can convince any of them that harpies are anything but monstrous, you are a fool.'"
 wyvernmark.3.a:0 "My apologies, I misspoke."
 wyvernmark.3.tt:0 "§YSo long as the Convent is in power, we cannot demonsterize!§!"
 
 wyvernmark.4.t:0 "A momentuous occasion"
 wyvernmark.4.d:0 "Today is [A33.Heir.getName]'s fifteenth birthday. As she comes of age, all eyes in Verne are focused on the future Duchess' debut ceremony.\n\nLittle do they know, by the time the party is over, she will already be Duchess."
 wyvernmark.4.a:0 "Our dearest respect for the late Duke."
 
 wyvernmark.5.t:0 "The Convent Moves In"
 wyvernmark.5.d:0 "Now that our country is firmly under the control of Wyvernmarker harpies, the administration is slowly being co-opted by representatives of those harpies. We are now part of that conspiracy, and are no longer a human nation."
 wyvernmark.5.a:0 "Unbeknownst to our subjects, things have changed."
 
 wyvernmark.9.t:0 "Disguised Harpy Caught!"
 wyvernmark.9.d:0 "A band of adventurers has alerted us to a potentially disturbing piece of news: a monstrous harpy has been going around disguising herself as a respected member of our Convent!\n\nWhether she was careless or tragically unlucky, this sister of ours has had her identity exposed while negotiations with these adventurers. Fortunately for us, it seems like the adventurers assume this was an isolated incident. Without us even having to suggest the possibility, these fools have convinced themselves that our Convent is a virtuous and upstanding organization, and that this harpy took advantage of our reputation to approach her prey. That this mustache of a man thought he was qualified to be our prey was beyond laughable, but the situation remains that our sister will be killed if we do not intervene.\n\nIf we do step in, however, we run the risk of losing the trust we've garnered with these adventurers. We would become the state that sided with monsters over gallant adventurers. Perhaps they may even start to consider what we might be hiding.\n\nSo, what do we say to these mustached brutes?"
 wyvernmark.9.a:0 "Yes, kill the monster!"
 wyvernmark.9.b:0 "Good work men, why don't you let us handle it from here?"
 wyvernmark.9.c:0 "Stop this madness! Let her go!"
 
 wyvernmark.10.t:0 "A Disloyal Flock"
 wyvernmark.10.d:0 "We've identified a certain renegade group of harpies in [Root.GetName] who refuse to abide by the Convent's ways."
 wyvernmark.10.a:0 "Keep it under wraps"
 wyvernmark.10.b:0 "Mr. Adventurer! There's a monster over here!"
 
 wyvernmark.11.t:0 "A Sneaking Suspicion"
 wyvernmark.11.d:0 "An administrator working at the court of [sus_country.GetName] has made an unusually astute observation: Isn't it strange that all of our country's leaders just so happen to be women? Isn't it strange that we insist on remaining covered at all times?"
 wyvernmark.11.a:0 "What? Nooo, I haven't the slightest clue what you're talking about!"
 wyvernmark.11.b:0 "Would some crowns convince you to look the other way?"
 
 #ideas
 A3A_legacy_of_the_wyvern_riders:0 "Legacy of the Wyvern Riders"
 A3A_legacy_of_the_wyvern_riders_desc:0 "As with our brothers in Verne, the legacy of Armoc Vernid, the first Wyvern King, lives on in the hills of Wyvernmark. However, while the Wyvern Riders may be a distant and glorious memory to the burghers of Verne, here that history is much more real.\n\nThe last surviving Wyverns make their roosts here in our hills, and the Margrave of Wyvernmark is chiefly tasked with ensuring these endangered populations are protected from prospective poachers. To that end, Wyvernmark seeks the aid of adventurers and mercenaries from Verne and beyond to guard the mountains from threats both external and internal."
 A3A_sarhaly_advice:0 "Sarhaly Advice"
 A3A_sarhaly_advice_desc:0 "Situated on the southern edge of the Empire of Anbennar, Wyvernmark is a place between worlds. Adventurers arrive from the north to guard the frontier, while traders and travelers come from the south on their way towards the markets of the Dameshead.\n\nThe arrival of 'The Convent' from Akasik has marked a dramatic deepening of ties between Wyvernmark and Sarhal, and the ideas they brought with them have drastically altered the way our state is run."
 A3A_gates_of_divenhal:0 "Gates of the Divenhal"
 A3A_gates_of_divenhal_desc:0 "The great Divenhal Sea expands to the east, while the storied Dameshead lies to the north. Here in Wyvernmark, we are ideally positioned to benefit from trade in both markets.\n\nThough these mountains may be barren now, our merchants know very well what sells best in every stall from the streets of Anbencost to the docks of Brasan."
 A3A_in_high_halls:0 "In High Halls"
 A3A_in_high_halls_desc:0 "Cannor is home to countless noble courts. A castle in Esmaria where the lord's servants all wear the latest fashion. A Lencori villa where wine flows more easily than water. A Gerudian hall echoing with boistrous laughter and tales of the old heroes.\n\nIf we are to be respected across the land - if we are to satisfy our ambition - we must learn the ways of each, and present our most fitting ambassador. Each sister of ours is raised from birth to integrate seamlessly into every aspect of Cannorian high society, and can easily earn the trust of even the most hard-hearted monarchs.\n\nEven when the lord believes our sister has assimilated into his court, we know her loyalty will only ever lie with Wyvernmark."
 A3A_soft_words:0 "Soft Words"
 A3A_soft_words_desc:0 "If done poorly, it can be easy to imagine our subjects reacting negatively to their new overlords. Too many sudden moves, and a ruler may quickly realize that they would have been better off not subjugating these people in the first place.\n\nWe, however, know how to be more subtle. Any who find themselves under the dominion of Wyvernmark will, at first, find it difficult to notice anything has changed. Rather than rule through fire, ash, and an iron fist, we find it is better to persuade the existing estates through soft words and a warm embrace.\n\nOnly after our control is unshakeable, and the people powerless to resist, will things change."
 A3A_handpicked_warriors:0 "Handpicked Warriors"
 A3A_handpicked_warriors_desc:0 "The rulers of Wyvernmark are not those who fill the ranks of our army.\n\nInstead, we have long followed the tradition of independent adventuring companies recruited from both within and without. One might assume that this would make for a disjointed and poorly-disciplined fighting force, but they would be mistaken. Unlike other states, Wyvernmark has the choice of the best and most experienced fighting companies from all across Cannor. Combined with our innate talent for leadership and a pinch of… persuasion, the best warriors on the continent will march in perfect lockstep against our enemies."
 A3A_into_the_fold:0 "Into the Fold"
 A3A_into_the_fold_desc:0 "The Convent's mission is to spread to every throne in Cannor, but we must be careful not to allow these newly-minted queens and duchesses to forget who it was who placed them on their thrones.\n\nShe may be queen of a proud kingdom to her subjects, one with nothing in common with Wyvernmark, but to us she will always be a lesser sister of The Convent. She must always respect our customs, and she must always give the Matriarch her due."
 
 #Mechanics
 crypto_harpy_reform:0 "Cryptoharpy Matriarchy"
 crypto_harpy_reform_desc:0 "Our country is ruled by a flock of harpies, but the rest of the world doesn't have to know that. By paying careful attention to what she wears and how she acts, our Matriarch can walk the halls of any royal court in Cannor like any other noble lady. \n\nA shame, however, that our wings would give us away."
 estate_human_adventurers:0 "Human Adventurers"
 estate_nobles_noble_wyvernriders:0 "Noble Wyvernriders"
 estate_human_adventurers_ride_of_the_worthy:0 "Adventurer Wyvernriders"
 estate_human_adventurers_monopoly_of_slaves:0 "Monopoly on Slaves"
