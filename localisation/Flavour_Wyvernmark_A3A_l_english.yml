 #100 events - Part 1
 wyvernmark.100.t:0 "The Convent"
 wyvernmark.100.d:0 "She wore a long-sleeved black dress that dragged across the floor. White gloves that left nothing exposed. A veil that covered everything but her face.\n\nShe arrived several years ago as part of a group of women people called 'The Convent,' though they never let on what god they served. Even now, long after Ishtara and I married, her 'Sisters' still remain an enigma.\n\nThey came from the South, she had said once. From the land of Akasik, ravaged by ferocious gnolls. Every day I see her, it aches me that Wyvernmark is too weak to do anything about those beasts. If only I was a greater ruler. If only our land had the resources to mount an expedition.\n\nIf only the spirit of Castan II flowed through my veins, I wouldn't hesitate to be the first on the beaches to liberate her homeland.\n\nAlas, my dear Ishtara has persuaded me to keep my calm. She is safe now, here in Bronzewing Hall. Her 'Sisters' all employed as handmaidens in the castle. Some of them have even found husbands and built families. It delights me to see their children -- all daughters, by some funny coincidence -- run about the castle grounds, never to know the cruelties of the monsters their mothers escaped.\n\nIshtara and I have three daughters of our own, each one precious and talented beyond belief. She and I have supported each other through thick and thin, and every night I whisper the same words of gratitude in her ear:"
 wyvernmark.100.a:0 "My dear Ishtara, I will love you until my dying breath."
 
 wyvernmark.101.t:0 "Scars"
 wyvernmark.101.d:0 "I rarely get the opportunity to see Ishtara beneath her robes. Even in bed, she is remarkably modest. Still, over these years, I've seen enough. Her skin is marred with horrendous scars.\n\nThey are relics, I believe, of the life she and her 'sisters' lived on the other side of the Divenhal. Reminders of the wanton and inexcusable cruelties of the gnolls, a race the gods should never have allowed to exist.\n\nMost prominent of her scars is a pair of wide pus-filled gashes running down her back, from her shoulders to her waist. She always refused to let me look at them, so it is only from our embraces that I know the extent of her injuries.\n\nWhen first I noticed those scars, I declared that I would sail down to Akasik and slay the beasts myself! She only smiled in reply.\n\nThat was years ago. Now, our eldest daughter Asturia is thirteen, and today marks her debut into public life.\n\nI"ve ordered the finest dress for her, and although she insists on wearing the same gloves and veil her mother does, she looks as if a true princess has come to grace this backwater realm of Wyvernmark.\n\nShe greeted the visiting dignitaries with grace far beyond her years, and even when a boorish man lifted her veil to sneak in a kiss, she told him off with such propriety and authority, I was almost ready to abdicate and declare her Margravine on the spot!\n\nHold on, when he lifted her veil, for just the briefest moment... Were those scars I saw on her back? Scars almost identical to her mother's?"
 wyvernmark.101.a:0 "No, I must be imagining things."
 
 wyvernmark.102.t:0 "A Gift from a Loving Wife"
 wyvernmark.102.d:0 "If the slavers who took her were human, perhaps they may have only clipped her flight feathers. That way she would have been able to keep her pride, even if robbed of her flight.\n\nIn a sense, it was fortunate, then, that it was gnolls who enslaved her instead.\n\nIshtara may have worn a habit, but she was no nun. Her sisters in 'The Convent' worshipped no god. They were birds who had migrated from the south to build a nest in these mountains. 'Stonewings,' they were called, although all her sisters now lacked any visible wings. It was fate's penchant for irony that allowed them to survive -- the cruelty of those ravenous beasts who enslaved them was the only reason they were now able to pass themselves off as an eccentric group of human women.\n\nTheir grudge against the gnolls was obvious, but it was the humans who truly earned Ishtara's ire. For centuries, her people have lived in harmony alongside the humans of Akasik, but every last one of those smoothskin land-walkers only averted their eyes as the gnolls paraded her and her sisters through the streets in chains. It should have come as no surprise -- humans have always been the most treacherous race. Were it not for the humans and their 'heroes,' the Stonewings would still soar the skies over the mighty Godshield Mountains, living according to the ways of the Old Hunt!\n\nYet, when the lord of this backwater fiefdom asked for her hand in marriage, Ishtara did not refuse him. She did not love him, not at all. Nor was she forced into the arrangement. No, she hated him and all his people, and this marriage was her way of revenge.\n\nPerhaps poor Roger might have felt it strange that she only ever bore him daughters, but it was far too late for him to do anything about it. Their eldest, Asturia -- sheared of her wings at birth to maintain the masquerade -- would soon be coming of age.\n\nTonight, Ishtara will enter the lord's chambers as she always had, and she will expose her secret. Roger will know that the woman he married is a monster. He will know his bloodline will only live on through monsters."
 wyvernmark.102.a:0 "And he will take those secrets to the grave."
 
 wyvernmark.103.t:0 "First of Her Name"
 wyvernmark.103.d:0 "Today is the day.\n\nToday, I will take my father's throne and wield the ceremonial mace as Asturia I, rightful Margravine of Wyvernmark. The first of my kind to rule in Western Cannor since the days of Beastbane. Yet, amid all the festivities, my hand reaches to the skin on my back.\n\nThe scars, the stumps of a limb I never knew. I was never meant to rule; I was meant to fly.\n\nFor all my life, I have cursed my mother and the handmaidens who stole the sky from me. I spurned them. Shouted at them. Made preparations to run away from the castle and join an adventuring band.\n\nWhen I was caught halfway out the door, my mother took me to watch a parade hosted in honor of our recent victory over the gnolls. Images of Beastbane abounded as effigies of gnolls, orcs, goblins, and -- yes -- harpies were beaten and burned in the festivities.\n\n'See how they hate you. See how they wish you dead. These are your people.' On that day, my mother leaned in close, her lips brushing against my ears as she whispered. 'You will rule over them, and your daughters will one day rule over all of Castan's people. Do not mourn what I have stolen, for you will fly far higher than some paltry wings could ever take you.'\n\n'Let others wage war,' she said."
 wyvernmark.103.a:0 "You, harpy Asturia, marry."
 
